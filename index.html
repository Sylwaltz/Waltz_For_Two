<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="[Susanne Quan]" />
    <meta name="color-scheme" content="dark light" />

    <title>☻ Memory Gacha</title>
    <link rel="stylesheet" href="./assets/style/normal.css" />

    <!-- Importeer het webring component, voeg jouw eigen domein toe in data-page -->
    <script
      data-page="[https://sylwaltz.nl/]"
      src="https://digitaaltuintje.nl/webring.js"
      defer
    ></script>
  </head>

  <body>
    <!-- Bovenste banner -->
    <header>
      <nav>
        <h1>Memory Gacha</h1>
        <a href="index.html"> Home</a>
        <a href=""> Collection</a>
        <a href=""> Contact/ About</a>
      </nav>
    </header>
    <form>
      <label>
        <input type="radio" name="theme" value="auto-theme" checked />
      </label>
      <label>
        <input type="radio" name="theme" value="light-theme" />
        <img
          src="./images/images-web/Mattias-OFF.png"
          alt="Image button that switches on light mode"
        />
        <img
          src="./images/images-web/Mattias-ON.png"
          alt="Image button that shows when light mode is turned on"
        />
      </label>
      <label>
        <input type="radio" name="theme" value="dark-theme" />
        <img
          src="./images/images-web/Vince-OFF.png"
          alt="Image button that switches on dark mode"
        />
      </label>
    </form>

    <main>
      <button popovertarget="Gacha">
        <img src="./images/images-web/Gachapon-NEW.png" alt="Main gachapon" />
      </button>

      <article popover id="Gacha">
        <img
          src="./images/images-web/NEW-Capsule.png"
          alt="Gacha capsule hidden"
        />

        <button popovertarget="Capsule">Open me!</button>

        <div popover id="Capsule">
          <img src="./images/images-web/NEW-Cat.png" alt="Gacha capsule show" />
        </div>
      </article>
    </main>

</html>
